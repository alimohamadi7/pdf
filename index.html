<style>
  :root{
    --bg:#EDF1EF;
    --surface:#FFFFFF;
    --ink:#1B2426;
    --ink-soft:#5B6B6D;
    --border:#D7DEDC;
    --teal:#2F6F63;
    --teal-dark:#245650;
    --amber:#E0A22E;
    --highlight:rgba(255,214,51,.55);
    --danger:#C1573E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Vazirmatn', sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:30px; height:30px; border-radius:7px;
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    position:relative; flex:none;
  }
  .brand .mark::after{
    content:""; position:absolute; inset:6px 6px 6px auto; width:2px;
    background:var(--amber); left:8px; top:6px; bottom:6px;
  }
  .brand h1{font-size:16px; font-weight:700; margin:0;}
  .brand span{font-size:12px; color:var(--ink-soft);}

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 22px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  button{
    font-family:inherit; font-size:13px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); border-radius:8px;
    padding:8px 14px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:background .15s, border-color .15s, color .15s;
  }
  button:hover{border-color:var(--teal);}
  button.primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  button.primary:hover{background:var(--teal-dark);}
  button.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .sep{width:1px; height:24px; background:var(--border); margin:0 4px;}
  .colorctrl{display:flex; align-items:center; gap:6px;}
  .swatch{
    width:22px; height:22px; padding:0; border-radius:50%;
    border:2px solid transparent; cursor:pointer;
  }
  .swatch.active{border-color:var(--ink);}
  .swatch.none{
    background:#fff; color:var(--ink-soft); font-size:11px;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--border);
  }
  .swatch.none.active{border-color:var(--ink);}
  .sizectrl{display:flex; align-items:center; gap:6px; font-size:13px;}
  .sizectrl button{padding:6px 10px;}
  #sizeLabel{min-width:20px; text-align:center; color:var(--ink-soft);}
  .pagectrl{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
  #fileInput{display:none;}

  main{
    display:flex; justify-content:center; padding:32px 16px 80px;
  }
  #emptyState{
    text-align:center; color:var(--ink-soft); margin-top:80px; font-size:14px;
  }
  #emptyState button{margin-top:14px;}

  .page-stage{
    position:relative; background:#fff; box-shadow:0 4px 24px rgba(20,30,30,.12);
    margin-bottom:20px; border-radius:2px; overflow:hidden;
  }
  .page-stage canvas{display:block;}

  .textLayer{
    position:absolute; inset:0; overflow:hidden; line-height:1;
    opacity:1;
  }
  .textLayer span{
    color:transparent; position:absolute; white-space:pre; cursor:text;
    transform-origin:0 0;
  }
  .textLayer ::selection{ background:rgba(47,111,99,.35); }

  .annotationLayer{ position:absolute; inset:0; pointer-events:none; }
  .annotationLayer .hl{
    position:absolute; background:var(--highlight); border-radius:2px;
    cursor:pointer; pointer-events:auto;
  }
  .annotationLayer .hl .hldel{
    position:absolute; top:-11px; left:-11px; width:20px; height:20px;
    border-radius:50%; background:var(--danger); color:#fff; border:2px solid #fff;
    font-size:12px; line-height:1; padding:0; display:none;
    align-items:center; justify-content:center; cursor:pointer; z-index:5;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .annotationLayer .hl:hover .hldel{ display:flex; }
  .annotationLayer .hl .hlmove{
    position:absolute; top:-11px; right:-11px; width:20px; height:20px;
    border-radius:50%; background:var(--teal); color:#fff; border:2px solid #fff;
    font-size:11px; line-height:1; padding:0; display:none;
    align-items:center; justify-content:center; cursor:move; z-index:5;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .annotationLayer .hl:hover .hlmove{ display:flex; }
  body.highlight-mode .page-stage{ cursor:crosshair; }
  body.highlight-mode .textLayer{ user-select:none; -webkit-user-select:none; }
  .annotationLayer .txtwrap{ position:absolute; pointer-events:auto; }
  .annotationLayer .txtbox{
    min-width:24px; min-height:20px; max-width:260px;
    font-family:'Vazirmatn', sans-serif; direction:rtl; text-align:right;
    outline:none; cursor:text; padding:1px 3px;
    border:1px dashed transparent; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word;
  }
  .txtwrap:hover .txtbox, .txtbox:focus{
    border-color:rgba(193,87,62,.5);
  }
  .txtwrap .txtdel{
    position:absolute; top:-11px; left:-11px; width:20px; height:20px;
    border-radius:50%; background:var(--danger); color:#fff; border:2px solid #fff;
    font-size:12px; line-height:1; padding:0; display:none;
    align-items:center; justify-content:center; cursor:pointer; z-index:5;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .txtwrap:hover .txtdel, .txtwrap.focused .txtdel{ display:flex; }
  .txtwrap .txtmove{
    position:absolute; top:-11px; right:-11px; width:20px; height:20px;
    border-radius:50%; background:var(--teal); color:#fff; border:2px solid #fff;
    font-size:11px; line-height:1; padding:0; display:none;
    align-items:center; justify-content:center; cursor:move; z-index:5;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .txtwrap:hover .txtmove, .txtwrap.focused .txtmove{ display:flex; }
  .txtwrap.dragging{ opacity:.85; }
  .txtwrap .txtresize{
    position:absolute; left:-7px; top:50%; transform:translateY(-50%);
    width:11px; height:26px; border-radius:5px;
    background:var(--ink-soft); border:2px solid #fff;
    display:none; cursor:ew-resize; z-index:5;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .txtwrap:hover .txtresize, .txtwrap.focused .txtresize{ display:block; }

  .hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:12.5px; padding:9px 16px;
    border-radius:20px; opacity:.92; display:none; z-index:40;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>برگه‌نویس</h1>
      <span>افزودن یادداشت و هایلایت روی PDF</span>
    </div>
  </div>
  <div>
    <input type="file" id="fileInput" accept="application/pdf" />
    <button class="primary" id="openBtn">باز کردن PDF</button>
  </div>
</header>

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

let pdfDocJS = null;
let originalBytes = null;
let currentPage = 1;
let numPages = 1;
let pageState = {}; // { [pageNum]: { texts:[{id,xPdf,yPdf,text,size}], highlights:[{id,xPdf,yPdf,wPdf,hPdf}] } }
let mode = 'view'; // 'view' | 'text' | 'highlight'
let idCounter = 1;
let textDefaults = { color: '#C1573E', size: 14, bg: '' };
let activeText = null; // last-focused text annotation object (+ its div)

const fileInput = document.getElementById('fileInput');
const openBtn = document.getElementById('openBtn');
const openBtn2 = document.getElementById('openBtn2');
const toolbar = document.getElementById('toolbar');
const viewer = document.getElementById('viewer');
const emptyState = document.getElementById('emptyState');
const modeTextBtn = document.getElementById('modeTextBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageLabel = document.getElementById('pageLabel');
const clearBtn = document.getElementById('clearBtn');
const exportBtn = document.getElementById('exportBtn');
const modeHighlightBtn = document.getElementById('modeHighlightBtn');
const hint = document.getElementById('hint');
const colorCtrl = document.getElementById('colorCtrl');
const bgCtrl = document.getElementById('bgCtrl');
const sizeMinus = document.getElementById('sizeMinus');
const sizePlus = document.getElementById('sizePlus');
const sizeLabel = document.getElementById('sizeLabel');

colorCtrl.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.swatch');
  if (!btn) return;
  const color = btn.dataset.color;
  colorCtrl.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  textDefaults.color = color;
  if (activeText) {
    activeText.anno.color = color;
    activeText.div.style.color = color;
  }
});

bgCtrl.addEventListener('click', (ev) => {
  const btn = ev.target.closest('.swatch');
  if (!btn) return;
  const bg = btn.dataset.bg;
  bgCtrl.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  textDefaults.bg = bg;
  if (activeText) {
    activeText.anno.bg = bg;
    activeText.div.style.backgroundColor = bg ? hexToRgba(bg, 0.55) : 'transparent';
  }
});

function updateSizeLabel(){ sizeLabel.textContent = toFa(textDefaults.size); }

sizeMinus.addEventListener('click', () => {
  textDefaults.size = Math.max(8, textDefaults.size - 2);
  updateSizeLabel();
  if (activeText) {
    activeText.anno.size = textDefaults.size;
    activeText.div.style.fontSize = textDefaults.size + 'px';
  }
});
sizePlus.addEventListener('click', () => {
  textDefaults.size = Math.min(48, textDefaults.size + 2);
  updateSizeLabel();
  if (activeText) {
    activeText.anno.size = textDefaults.size;
    activeText.div.style.fontSize = textDefaults.size + 'px';
  }
});

openBtn.addEventListener('click', () => fileInput.click());
openBtn2.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  originalBytes = await file.arrayBuffer();
  const loadingTask = pdfjsLib.getDocument({
    data: originalBytes.slice(0),
    disableFontFace: true
  });
  pdfDocJS = await loadingTask.promise;
  numPages = pdfDocJS.numPages;
  currentPage = 1;
  pageState = {};
  emptyState.style.display = 'none';
  viewer.style.display = 'block';
  toolbar.style.display = 'flex';
  hint.style.display = 'block';
  setTimeout(() => hint.style.display = 'none', 5000);
  await renderPage(currentPage);
});

function setMode(newMode){
  mode = (mode === newMode) ? 'view' : newMode;
  modeTextBtn.classList.toggle('active', mode === 'text');
  modeHighlightBtn.classList.toggle('active', mode === 'highlight');
  document.body.classList.toggle('highlight-mode', mode === 'highlight');
}
modeTextBtn.addEventListener('click', () => setMode('text'));
modeHighlightBtn.addEventListener('click', () => setMode('highlight'));

prevBtn.addEventListener('click', async () => {
  if (currentPage > 1) { currentPage--; await renderPage(currentPage); }
});
nextBtn.addEventListener('click', async () => {
  if (currentPage < numPages) { currentPage++; await renderPage(currentPage); }
});
clearBtn.addEventListener('click', () => {
  pageState[currentPage] = { texts: [], highlights: [] };
  renderPage(currentPage);
});

function getPageStateFor(p){
  if (!pageState[p]) pageState[p] = { texts: [], highlights: [] };
  return pageState[p];
}

let currentViewport = null;
let currentPageHeightPt = 0;

async function renderPage(pageNum){
  pageLabel.textContent = toFa(pageNum) + ' / ' + toFa(numPages);
  prevBtn.disabled = pageNum <= 1;
  nextBtn.disabled = pageNum >= numPages;

  const page = await pdfDocJS.getPage(pageNum);
  const viewport = page.getViewport({ scale: SCALE });
  const unscaledViewport = page.getViewport({ scale: 1 });
  currentViewport = viewport;
  currentPageHeightPt = unscaledViewport.height;

  viewer.innerHTML = '';
  const stage = document.createElement('div');
  stage.className = 'page-stage';
  stage.style.width = viewport.width + 'px';
  stage.style.height = viewport.height + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  stage.appendChild(canvas);

  const textLayerDiv = document.createElement('div');
  textLayerDiv.className = 'textLayer';
  textLayerDiv.style.width = viewport.width + 'px';
  textLayerDiv.style.height = viewport.height + 'px';
  textLayerDiv.style.setProperty('--scale-factor', SCALE);
  stage.appendChild(textLayerDiv);

  const annoLayer = document.createElement('div');
  annoLayer.className = 'annotationLayer';
  stage.appendChild(annoLayer);

  viewer.appendChild(stage);

  await page.render({ canvasContext: ctx, viewport }).promise;

  const textContent = await page.getTextContent();
  pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textLayerDiv,
    viewport: viewport,
    textDivs: []
  });

  // click to add text box
  stage.addEventListener('click', (ev) => {
    if (mode !== 'text') return;
    if (ev.target.closest('.txtwrap') || ev.target.closest('.hl')) return;
    const rect = stage.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    addTextBox(x, y);
  });

  // draw existing annotations for this page
  const st = getPageStateFor(pageNum);
  st.texts.forEach(t => drawTextBox(t, false));
  st.highlights.forEach(h => drawHighlight(h));

  // drag-to-paint highlight tool (works over PDF text AND over your own typed text boxes)
  stage.addEventListener('mousedown', (ev) => {
    if (mode !== 'highlight') return;
    if (ev.target.closest('.hl') || ev.target.closest('.txtwrap')) return;
    ev.preventDefault();
    const stageRect = stage.getBoundingClientRect();
    const startX = ev.clientX - stageRect.left;
    const startY = ev.clientY - stageRect.top;

    const currentHlColor = textDefaults.bg || '#FFEB3B';
    const preview = document.createElement('div');
    preview.style.position = 'absolute';
    preview.style.left = startX + 'px';
    preview.style.top = startY + 'px';
    preview.style.width = '0px';
    preview.style.height = '0px';
    preview.style.background = hexToRgba(currentHlColor, 0.55);
    preview.style.outline = '1px dashed #B8860B';
    preview.style.pointerEvents = 'none';
    annoLayer.appendChild(preview);

    function onMove(e2){
      const x2 = e2.clientX - stageRect.left;
      const y2 = e2.clientY - stageRect.top;
      const left = Math.min(startX, x2), top = Math.min(startY, y2);
      preview.style.left = left + 'px';
      preview.style.top = top + 'px';
      preview.style.width = Math.abs(x2 - startX) + 'px';
      preview.style.height = Math.abs(y2 - startY) + 'px';
    }
    function onUp(e2){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      const x2 = e2.clientX - stageRect.left;
      const y2 = e2.clientY - stageRect.top;
      const left = Math.min(startX, x2), top = Math.min(startY, y2);
      const w = Math.abs(x2 - startX), h = Math.abs(y2 - startY);
      preview.remove();
      if (w > 3 && h > 3) {
        const hAnno = toPdfRect(left, top, w, h);
        hAnno.color = currentHlColor;
        st.highlights.push(hAnno);
        drawHighlight(hAnno);
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  function toPdfRect(x, y, w, h){
    return {
      id: idCounter++,
      xPdf: x / SCALE,
      yPdf: currentPageHeightPt - (y + h) / SCALE,
      wPdf: w / SCALE,
      hPdf: h / SCALE
    };
  }

  function drawHighlight(hAnno){
    const div = document.createElement('div');
    div.className = 'hl';
    div.style.left = (hAnno.xPdf * SCALE) + 'px';
    div.style.top = ((currentPageHeightPt - hAnno.yPdf - hAnno.hPdf) * SCALE) + 'px';
    div.style.width = (hAnno.wPdf * SCALE) + 'px';
    div.style.height = (hAnno.hPdf * SCALE) + 'px';
    div.style.background = hexToRgba(hAnno.color || '#FFEB3B', 0.55);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'hldel';
    delBtn.textContent = '✕';
    delBtn.title = 'حذف این هایلایت';
    delBtn.addEventListener('mousedown', (ev) => ev.preventDefault());
    delBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      st.highlights = st.highlights.filter(h => h.id !== hAnno.id);
      div.remove();
    });
    div.appendChild(delBtn);

    div.addEventListener('dblclick', (ev) => {
      ev.stopPropagation();
      st.highlights = st.highlights.filter(h => h.id !== hAnno.id);
      div.remove();
    });

    const moveBtn = document.createElement('button');
    moveBtn.type = 'button';
    moveBtn.className = 'hlmove';
    moveBtn.textContent = '✥';
    moveBtn.title = 'بکش تا جابه‌جا کنی';
    moveBtn.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const startX = ev.clientX, startY = ev.clientY;
      const startLeft = parseFloat(div.style.left);
      const startTop = parseFloat(div.style.top);
      function onMove(e2){
        div.style.left = (startLeft + (e2.clientX - startX)) + 'px';
        div.style.top = (startTop + (e2.clientY - startY)) + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const newLeft = parseFloat(div.style.left);
        const newTop = parseFloat(div.style.top);
        hAnno.xPdf = newLeft / SCALE;
        hAnno.yPdf = currentPageHeightPt - (newTop + hAnno.hPdf * SCALE) / SCALE;
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    div.appendChild(moveBtn);

    annoLayer.appendChild(div);
  }

  function addTextBox(x, y){
    const tAnno = {
      id: idCounter++,
      xPdf: x / SCALE,   // right edge anchor (matches RTL: text grows leftward from click point)
      yPdf: currentPageHeightPt - y / SCALE,  // top edge anchor
      text: '',
      size: textDefaults.size,
      color: textDefaults.color,
      bg: textDefaults.bg,
      widthPdf: null // null = default auto-width (up to MAX_TEXT_WIDTH_PX); set once user resizes
    };
    st.texts.push(tAnno);
    drawTextBox(tAnno, true);
  }

  function drawTextBox(tAnno, focus){
    const wrap = document.createElement('div');
    wrap.className = 'txtwrap';
    wrap.style.right = (viewport.width - tAnno.xPdf * SCALE) + 'px';
    wrap.style.top = ((currentPageHeightPt - tAnno.yPdf) * SCALE) + 'px';

    const div = document.createElement('div');
    div.className = 'txtbox';
    div.contentEditable = 'true';
    div.style.fontSize = (tAnno.size) + 'px';
    div.style.color = tAnno.color;
    div.style.backgroundColor = tAnno.bg ? hexToRgba(tAnno.bg, 0.55) : 'transparent';
    if (tAnno.widthPdf) {
      div.style.width = (tAnno.widthPdf * SCALE) + 'px';
      div.style.maxWidth = 'none';
    }
    div.textContent = tAnno.text;
    div.addEventListener('input', () => { tAnno.text = div.innerText; });
    div.addEventListener('focus', () => {
      wrap.classList.add('focused');
      activeText = { anno: tAnno, div: div };
      textDefaults.size = tAnno.size;
      textDefaults.color = tAnno.color;
      textDefaults.bg = tAnno.bg || '';
      updateSizeLabel();
      colorCtrl.querySelectorAll('.swatch').forEach(s => {
        s.classList.toggle('active', s.dataset.color.toLowerCase() === tAnno.color.toLowerCase());
      });
      bgCtrl.querySelectorAll('.swatch').forEach(s => {
        s.classList.toggle('active', s.dataset.bg === (tAnno.bg || ''));
      });
    });
    div.addEventListener('blur', () => { wrap.classList.remove('focused'); });
    div.addEventListener('keydown', (ev) => { ev.stopPropagation(); });

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'txtdel';
    delBtn.textContent = '✕';
    delBtn.title = 'حذف این یادداشت';
    delBtn.addEventListener('mousedown', (ev) => { ev.preventDefault(); }); // don't steal focus/selection
    delBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      st.texts = st.texts.filter(t => t.id !== tAnno.id);
      if (activeText && activeText.anno.id === tAnno.id) activeText = null;
      wrap.remove();
    });

    const moveBtn = document.createElement('button');
    moveBtn.type = 'button';
    moveBtn.className = 'txtmove';
    moveBtn.textContent = '✥';
    moveBtn.title = 'بکش تا جابه‌جا کنی';
    moveBtn.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      wrap.classList.add('dragging');
      const startX = ev.clientX, startY = ev.clientY;
      const startRight = parseFloat(wrap.style.right);
      const startTop = parseFloat(wrap.style.top);
      function onMove(e2){
        wrap.style.right = (startRight - (e2.clientX - startX)) + 'px';
        wrap.style.top = (startTop + (e2.clientY - startY)) + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        wrap.classList.remove('dragging');
        const newRight = parseFloat(wrap.style.right);
        const newTop = parseFloat(wrap.style.top);
        tAnno.xPdf = (viewport.width - newRight) / SCALE;
        tAnno.yPdf = currentPageHeightPt - newTop / SCALE;
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'txtresize';
    resizeHandle.title = 'بکش تا عرض متن رو تغییر بدی';
    resizeHandle.addEventListener('mousedown', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const startX = ev.clientX;
      const startWidth = div.getBoundingClientRect().width;
      div.style.maxWidth = 'none'; // switch to explicit fixed width while dragging
      function onMove(e2){
        const newWidth = Math.max(40, startWidth - (e2.clientX - startX)); // dragging left = wider (RTL box)
        div.style.width = newWidth + 'px';
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const finalWidthPx = div.getBoundingClientRect().width;
        tAnno.widthPdf = finalWidthPx / SCALE;
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    wrap.appendChild(div);
    wrap.appendChild(delBtn);
    wrap.appendChild(moveBtn);
    wrap.appendChild(resizeHandle);
    annoLayer.appendChild(wrap);
    if (focus) setTimeout(() => div.focus(), 0);
  }
}

function wrapLineToWidth(font, text, size, maxWidth){
  if (!text) return [''];
  const words = text.split(' ');
  const outLines = [];
  let current = '';
  words.forEach(word => {
    // a single word wider than the whole box: break it character-by-character (matches CSS overflow-wrap:break-word on screen)
    if (font.widthOfTextAtSize(word, size) > maxWidth) {
      if (current) { outLines.push(current); current = ''; }
      let chunk = '';
      for (const ch of word) {
        const candidateChunk = chunk + ch;
        if (font.widthOfTextAtSize(candidateChunk, size) <= maxWidth || !chunk) {
          chunk = candidateChunk;
        } else {
          outLines.push(chunk);
          chunk = ch;
        }
      }
      current = chunk;
      return;
    }
    const candidate = current ? current + ' ' + word : word;
    if (font.widthOfTextAtSize(candidate, size) <= maxWidth || !current) {
      current = candidate;
    } else {
      outLines.push(current);
      current = word;
    }
  });
  if (current) outLines.push(current);
  return outLines.length ? outLines : [''];
}

function hexToRgba(hex, alpha){
  const [r,g,b] = hexToRgb01(hex);
  return `rgba(${Math.round(r*255)}, ${Math.round(g*255)}, ${Math.round(b*255)}, ${alpha})`;
}

function hexToRgb01(hex){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16) / 255;
  const g = parseInt(h.substring(2,4), 16) / 255;
  const b = parseInt(h.substring(4,6), 16) / 255;
  return [r, g, b];
}

function toFa(n){
  const map = {0:'۰',1:'۱',2:'۲',3:'۳',4:'۴',5:'۵',6:'۶',7:'۷',8:'۸',9:'۹'};
  return String(n).split('').map(c => map[c] !== undefined ? map[c] : c).join('');
}

exportBtn.addEventListener('click', async () => {
  if (!originalBytes) return;
  exportBtn.disabled = true;
  exportBtn.textContent = 'در حال ساخت خروجی...';
  try{
    const { PDFDocument, rgb } = PDFLib;
    const outDoc = await PDFDocument.load(originalBytes.slice(0));
    outDoc.registerFontkit(fontkit);

    const fontBytes = base64ToArrayBuffer(VAZIR_TTF_BASE64);
    const customFont = await outDoc.embedFont(fontBytes, { subset: true });

    const pages = outDoc.getPages();

    Object.keys(pageState).forEach(pnStr => {
      const pn = parseInt(pnStr, 10);
      const page = pages[pn - 1];
      if (!page) return;
      const st = pageState[pn];

      st.highlights.forEach(h => {
        const [hr, hg, hb] = hexToRgb01(h.color || '#FFEB3B');
        page.drawRectangle({
          x: h.xPdf, y: h.yPdf, width: h.wPdf, height: h.hPdf,
          color: rgb(hr, hg, hb), opacity: 0.45
        });
      });

      st.texts.forEach(t => {
        if (!t.text || !t.text.trim()) return;
        const [r, g, b] = hexToRgb01(t.color || '#C1573E');
        const maxWidthPdf = t.widthPdf || (MAX_TEXT_WIDTH_PX / SCALE);
        const paragraphs = t.text.split('\n');
        const lines = [];
        paragraphs.forEach(p => {
          lines.push(...wrapLineToWidth(customFont, p, t.size, maxWidthPdf));
        });
        lines.forEach((line, i) => {
          const baseline = t.yPdf - t.size * 0.82 - i * (t.size * 1.3);
          const w = customFont.widthOfTextAtSize(line, t.size);
          const startX = t.xPdf - w; // right edge of the line = t.xPdf (RTL anchor)
          if (t.bg) {
            const [br, bg, bb] = hexToRgb01(t.bg);
            page.drawRectangle({
              x: startX - 2,
              y: baseline - t.size * 0.28,
              width: w + 4,
              height: t.size * 1.15,
              color: rgb(br, bg, bb),
              opacity: 0.55
            });
          }
          page.drawText(line, {
            x: startX,
            y: baseline,
            size: t.size,
            font: customFont,
            color: rgb(r, g, b)
          });
        });
      });
    });

    const outBytes = await outDoc.save();
    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'annotated.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(err){
    console.error(err);
    alert('خطا در ساخت PDF خروجی: ' + err.message);
  } finally {
    exportBtn.disabled = false;
    exportBtn.textContent = 'دانلود PDF خروجی';
  }
});
